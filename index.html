<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Shifa Clinic Management System</title>
    <style>
        /* Modern Healthcare CSS Variables and Theme Architecture */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --accent-color: #0f766e; /* Professional Medical Teal */
            --accent-hover: #115e59;
            --accent-light: #f0fdfa;
            --success-color: #16a34a;
            --warning-color: #ca8a04;
            --danger-color: #dc2626;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --transition-speed: 0.2s;
        }

        .dark-mode {
            --bg-primary: #0f172a; /* Deep Slate Blue */
            --bg-secondary: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent-color: #2dd4bf; /* Mint Teal */
            --accent-hover: #14b8a6;
            --accent-light: rgba(45, 212, 191, 0.1);
            --success-color: #4ade80;
            --warning-color: #facc15;
            --danger-color: #f87171;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* RTL Layout Override for Arabic Translation */
        body.rtl {
            direction: rtl;
            text-align: right;
        }

        /* Main Workspace Container Grid */
        .app-container {
            display: flex;
            flex: 1;
            position: relative;
        }

        /* Sidebar Navigation styling */
        .sidebar {
            width: 270px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all var(--transition-speed);
            z-index: 40;
        }

        body.rtl .sidebar {
            border-right: none;
            border-left: 1px solid var(--border-color);
        }

        .sidebar-brand {
            padding: 1.5rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--accent-color);
            font-weight: 700;
            font-size: 1.25rem;
        }

        .sidebar-brand svg {
            width: 32px;
            height: 32px;
            fill: var(--accent-color);
        }

        .sidebar-user {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--accent-light);
        }

        .sidebar-user-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .sidebar-user-role {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.25rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        .sidebar-menu {
            list-style: none;
            padding: 1rem 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .sidebar-menu-item {
            padding: 0.15rem 0.75rem;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .sidebar-link:hover, .sidebar-link.active {
            color: var(--accent-color);
            background-color: var(--accent-light);
        }

        .sidebar-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .sidebar-footer {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
        }

        /* Topbar Header styling */
        .topbar {
            height: 64px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            position: sticky;
            top: 0;
            z-index: 30;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-primary);
        }

        .menu-toggle svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Action Buttons styling */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-speed);
            border: 1px solid transparent;
            text-decoration: none;
        }

        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 0.375rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff !important;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--bg-primary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: #ffffff !important;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .btn-success {
            background-color: var(--success-color);
            color: #ffffff !important;
        }

        .btn-success:hover {
            opacity: 0.9;
        }

        /* Inputs & Controls styling */
        .control-select, .control-input {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.9rem;
            outline: none;
            min-height: 38px;
        }

        .control-select:focus, .control-input:focus {
            border-color: var(--accent-color);
        }

        /* Utility widgets */
        .toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            padding: 0.5rem;
            cursor: pointer;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition-speed);
        }

        .toggle-btn:hover {
            background-color: var(--bg-primary);
        }

        .toggle-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .sync-badge {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            background-color: rgba(22, 163, 74, 0.15);
            color: var(--success-color);
            cursor: pointer;
        }

        .sync-badge.offline {
            background-color: rgba(220, 38, 38, 0.15);
            color: var(--danger-color);
        }

        .sync-badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .timer-badge {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            background-color: rgba(202, 138, 4, 0.1);
            color: var(--warning-color);
            cursor: pointer;
        }

        /* Main workspace styling */
        .main-content {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Dashboard metrics cards */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.25rem;
        }

        .stat-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.25rem;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-card-info h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .stat-card-info p {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0.25rem;
            color: var(--accent-color);
        }

        .stat-card-icon {
            background-color: var(--accent-light);
            color: var(--accent-color);
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-card-icon svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* Content containers */
        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title svg {
            width: 20px;
            height: 20px;
            fill: var(--accent-color);
        }

        .card-body {
            padding: 1.5rem;
        }

        /* Tabular Layouts */
        .table-responsive {
            overflow-x: auto;
            width: 100%;
        }

        .clinic-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        body.rtl .clinic-table {
            text-align: right;
        }

        .clinic-table th {
            background-color: var(--bg-primary);
            padding: 0.75rem 1rem;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border-color);
        }

        .clinic-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-primary);
            vertical-align: middle;
        }

        .clinic-table tr:hover {
            background-color: var(--accent-light);
        }

        /* Badges status levels */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 0.375rem;
            text-transform: uppercase;
        }

        .badge-success { background-color: rgba(22, 163, 74, 0.15); color: var(--success-color); }
        .badge-warning { background-color: rgba(202, 138, 4, 0.15); color: var(--warning-color); }
        .badge-danger { background-color: rgba(220, 38, 38, 0.15); color: var(--danger-color); }
        .badge-info { background-color: rgba(15, 118, 110, 0.15); color: var(--accent-color); }

        /* Login screen */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
        }

        .login-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .login-header {
            background-color: var(--accent-color);
            padding: 2.5rem 1.5rem;
            color: #ffffff;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .login-header svg {
            width: 48px;
            height: 48px;
            fill: #ffffff;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .login-body {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .role-btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        .role-login-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            background: none;
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
            transition: all var(--transition-speed);
        }

        body.rtl .role-login-btn {
            text-align: right;
        }

        .role-login-btn:hover {
            border-color: var(--accent-color);
            background-color: var(--accent-light);
        }

        .role-login-btn svg {
            width: 32px;
            height: 32px;
            fill: var(--accent-color);
        }

        .role-login-btn h3 {
            font-size: 1rem;
            font-weight: 700;
        }

        .role-login-btn p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.15rem;
        }

        /* Form grids layout */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        /* Search Layout styling */
        .search-container {
            position: relative;
            width: 100%;
        }

        .search-results-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .search-result-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .search-result-card:hover {
            border-color: var(--accent-color);
            box-shadow: var(--card-shadow);
            transform: translateY(-1px);
        }

        /* Clinic Workspace splits */
        .doctor-workspace {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        @media (max-width: 992px) {
            .doctor-workspace {
                grid-template-columns: 1fr;
            }
        }

        /* Clinical Timeline layout */
        .timeline {
            position: relative;
            padding-left: 1.5rem;
            margin-top: 1rem;
            border-left: 2px solid var(--border-color);
        }

        body.rtl .timeline {
            padding-left: 0;
            padding-right: 1.5rem;
            border-left: none;
            border-right: 2px solid var(--border-color);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -21px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-color);
            border: 2px solid var(--bg-secondary);
        }

        body.rtl .timeline-item::before {
            left: auto;
            right: -21px;
        }

        .timeline-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .timeline-date {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .timeline-doctor {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .timeline-body {
            background-color: var(--bg-primary);
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Prescription inputs layout */
        .rx-row-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        /* Inline SVGs for trends and graphs */
        .trend-chart-container {
            width: 100%;
            height: 200px;
            position: relative;
            margin-top: 1rem;
            background-color: var(--bg-primary);
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Modal Dialog boxes */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        /* Hospital Receipt & Card Printings */
        .hospital-card-print {
            border: 2px dashed #000000;
            padding: 1.5rem;
            max-width: 450px;
            background-color: #ffffff;
            color: #000000;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 8px;
            margin: 0 auto;
        }

        .hospital-card-header {
            text-align: center;
            border-bottom: 1px dashed #000000;
            padding-bottom: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .hospital-card-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        /* Custom Pure CSS Bar Charts */
        .bar-chart-flex {
            display: flex;
            align-items: flex-end;
            gap: 1.5rem;
            height: 200px;
            padding-top: 1rem;
            border-bottom: 2px solid var(--border-color);
            border-left: 2px solid var(--border-color);
            padding-left: 0.5rem;
            margin-bottom: 1.5rem;
        }

        body.rtl .bar-chart-flex {
            border-left: none;
            border-right: 2px solid var(--border-color);
            padding-left: 0;
            padding-right: 0.5rem;
        }

        .bar-chart-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .bar-chart-bar {
            width: 100%;
            background-color: var(--accent-color);
            border-radius: 4px 4px 0 0;
            min-height: 4px;
            transition: height 0.5s ease-out;
            position: relative;
        }

        .bar-chart-bar:hover {
            opacity: 0.85;
        }

        .bar-chart-tooltip {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-primary);
            color: var(--bg-secondary);
            padding: 2px 6px;
            font-size: 0.75rem;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            font-weight: bold;
        }

        .bar-chart-label {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Diagnosis Progress tracking */
        .disease-progress-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .disease-progress-item {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .disease-progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .disease-progress-track {
            height: 8px;
            border-radius: 9999px;
            background-color: var(--bg-primary);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .disease-progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 9999px;
            transition: width 0.5s;
        }

        /* Toast notification banners */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 350px;
        }

        body.rtl .toast-container {
            right: auto;
            left: 2rem;
        }

        .toast {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border-left: 4px solid var(--accent-color);
            border: 1px solid var(--border-color);
            border-left-width: 5px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s forwards;
        }

        body.rtl .toast {
            border-left-width: 1px;
            border-right: 5px solid var(--accent-color);
        }

        .toast.toast-success { border-left-color: var(--success-color); }
        body.rtl .toast.toast-success { border-right-color: var(--success-color); }

        .toast.toast-danger { border-left-color: var(--danger-color); }
        body.rtl .toast.toast-danger { border-right-color: var(--danger-color); }

        .toast.toast-warning { border-left-color: var(--warning-color); }
        body.rtl .toast.toast-warning { border-right-color: var(--warning-color); }

        @keyframes slideIn {
            from { transform: translateY(1rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .print-only {
            display: none !important;
        }

        /* Desktop vs Mobile Media queries */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                display: none;
            }

            .sidebar.show {
                display: flex;
            }

            .menu-toggle {
                display: block;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .rx-row-grid {
                grid-template-columns: 1fr;
                gap: 0.35rem;
                border-bottom: 1px dashed var(--border-color);
                padding-bottom: 0.75rem;
            }

            .rx-row-grid button {
                justify-self: start;
            }
        }

        /* Native web browser printing templates */
        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
            }

            .no-print {
                display: none !important;
            }

            .print-only {
                display: block !important;
            }

            .modal {
                position: absolute !important;
                left: 0;
                top: 0;
                width: 100%;
                background: none !important;
                box-shadow: none !important;
            }

            .modal-content {
                box-shadow: none !important;
                border: none !important;
                max-width: 100% !important;
                max-height: 100% !important;
            }

            .modal-footer {
                display: none !important;
            }
        }
    </style>
</head>

        // Database loading
        function initDatabase() {
            const savedData = localStorage.getItem('clinic_db');
            if (savedData) {
                try {
                    state.db = JSON.parse(savedData);
                } catch (e) {
                    console.error("Failed to parse local storage DB, resetting to seeds.");
                    state.db = JSON.parse(JSON.stringify(DEFAULT_SEED_DATABASE));
                }
            } else {
                state.db = JSON.parse(JSON.stringify(DEFAULT_SEED_DATABASE));
                saveDatabase();
            }
        }

        // Save to cache store
        function saveDatabase() {
            localStorage.setItem('clinic_db', JSON.stringify(state.db));
            if (state.isOffline) {
                state.syncPendingCount++;
                updateSyncBadge();
            } else {
                state.syncPendingCount = 0;
                updateSyncBadge();
            }
        }

        // Push audit logs
        function logAction(actionText) {
            const logEntry = {
                timestamp: new Date().toISOString().substring(0, 16),
                user: state.currentUserRole || 'system',
                action: actionText
            };
            state.db.auditLogs.unshift(logEntry);
            saveDatabase();
        }

            return i18n['en'][key] || key;
        }

                btn.style.color = "var(--danger-color)";

        // Offline mode sync simulation
        function toggleOfflineMode() {
            state.isOffline = !state.isOffline;
            updateSyncBadge();
            if (!state.isOffline && state.syncPendingCount > 0) {
                showToast(`Back online! Syncing ${state.syncPendingCount} pending entries...`, 'success');
                state.syncPendingCount = 0;
                updateSyncBadge();
            } else {
                showToast(state.isOffline ? t('sync_offline') : t('sync_online'), state.isOffline ? 'warning' : 'success');
            }
        }

        function updateSyncBadge() {
            const badge = document.getElementById('syncStatusBadge');
            const txt = document.getElementById('sync_status_text');
            if (state.isOffline) {
                badge.className = "sync-badge offline";
                txt.innerText = `${t('sync_offline')} (${state.syncPendingCount} pending)`;
            } else {
                badge.className = "sync-badge";
                txt.innerText = t('sync_online');
            }
        }

        // Security session timeouts
        function resetInactivityTimer() {
            state.secondsLeft = 900; 
            updateTimerText();
            if (state.inactivityTimer) clearInterval(state.inactivityTimer);
            
            state.inactivityTimer = setInterval(() => {
                state.secondsLeft--;
                updateTimerText();
                if (state.secondsLeft <= 0) {
                    clearInterval(state.inactivityTimer);
                    performLogout();
                    alert(t('alert_session_expired'));
                } else if (state.secondsLeft === 60) {
                    showToast(t('alert_session_warning'), 'warning');
                }
            }, 1000);
        }

        function updateTimerText() {
            const m = Math.floor(state.secondsLeft / 60);
            const s = state.secondsLeft % 60;
            const formatted = `${m}:${s < 10 ? '0' + s : s}`;
            document.getElementById('timerText').innerText = `Expires in ${formatted}`;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <div style="flex:1; font-weight:600; font-size:0.9rem;">${message}</div>
                <button onclick="this.parentElement.remove()" style="background:none; border:none; color:inherit; font-weight:bold; cursor:pointer;">&times;</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 4000);
        }

        function renderActiveView() {
            const workspace = document.getElementById('mainWorkspace');
            workspace.innerHTML = ''; 

            const role = state.currentUserRole;
            const tab = state.currentTab;

            if (role === 'none') return; 

            if (tab === 'dashboard') {
                if (role === 'reception') renderReceptionDashboard(workspace);
                else if (role === 'doctor') renderDoctorDashboard(workspace);
                else if (role === 'laboratory') renderLabDashboard(workspace);
            } else if (tab === 'register') {
                renderRegisterPatientForm(workspace);
            } else if (tab === 'search') {
                renderSearchInterface(workspace);
            } else if (tab === 'appointments') {
                renderAppointmentsTab(workspace);
            } else if (tab === 'billing') {
                renderBillingTab(workspace);
            } else if (tab === 'inventory') {
                renderInventoryTab(workspace);
            } else if (tab === 'reports') {
                renderReportsTab(workspace);
            } else if (tab === 'audit') {
                renderAuditLogsTab(workspace);
            }
        }

        function calculateFormAge() {
            const dob = document.getElementById('regDob').value;
            if (!dob) return;
            const diffMs = Date.now() - new Date(dob).getTime();
            const ageDate = new Date(diffMs);
            const calculatedAge = Math.abs(ageDate.getUTCFullYear() - 1970);
            document.getElementById('regAge').value = calculatedAge;
        }

        function handlePatientRegistration(e) {
            e.preventDefault();
            const prefix = "PAT-2026-";
            const autoId = prefix + String(state.db.patients.length + 1).padStart(4, '0');
            
            const newPatient = {
                id: autoId,
                name: document.getElementById('regName').value,
                gender: document.getElementById('regGender').value,
                dob: document.getElementById('regDob').value,
                age: parseInt(document.getElementById('regAge').value) || 0,
                phone: document.getElementById('regPhone').value,
                address: document.getElementById('regAddress').value,
                emergency: document.getElementById('regEmergency').value
            };

            state.db.patients.push(newPatient);
            logAction(`Registered brand-new patient chart: ${newPatient.name} (${autoId})`);
            saveDatabase();
            showToast(`Patient successfully registered! ID: ${autoId}`, 'success');
            
            initiateVisitFromAppointment(autoId);
        }

        function initiateVisitFromAppointment(patientId, appointmentId = null) {
            const patient = state.db.patients.find(p => p.id === patientId);
            if (!patient) return;

            const modal = document.getElementById('generalModal');
            document.getElementById('modalTitle').innerText = `${t('new_visit')} - ${maskEncryptedText(patient.name, 10)}`;
            
            document.getElementById('modalBody').innerHTML = `
                <form id="visitVitalsForm" class="form-grid">
                    <div class="form-group">
                        <label>${t('select_doctor')} *</label>
                        <select class="control-select" id="vitDoctor" required>
                            <option value="Dr. Abdirahman Omar">Dr. Abdirahman Omar (General Medicine)</option>
                            <option value="Dr. Sarah Ahmed">Dr. Sarah Ahmed (Paediatrics)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>${t('weight')} *</label>
                        <input type="number" step="0.1" class="control-input" id="vitWeight" required placeholder="kg" onkeyup="recalculateModalBMI()">
                    </div>
                    <div class="form-group">
                        <label>${t('height')} *</label>
                        <input type="number" class="control-input" id="vitHeight" required placeholder="cm" onkeyup="recalculateModalBMI()">
                    </div>
                    <div class="form-group">
                        <label>${t('bmi')}</label>
                        <input type="text" class="control-input" id="vitBmi" readonly placeholder="Calculated BMI">
                    </div>
                    <div class="form-group">
                        <label>${t('bp')} (systolic/diastolic) *</label>
                        <input type="text" class="control-input" id="vitBp" required placeholder="e.g. 120/80">
                    </div>
                    <div class="form-group">
                        <label>${t('temp')} *</label>
                        <input type="number" step="0.1" class="control-input" id="vitTemp" required placeholder="°C">
                    </div>
                </form>
            `;

            const actBtn = document.getElementById('modalActionButton');
            actBtn.innerText = "Queue Visit";
            actBtn.onclick = () => {
                const vitForm = document.getElementById('visitVitalsForm');
                if (!vitForm.checkValidity()) {
                    vitForm.reportValidity();
                    return;
                }

                const w = parseFloat(document.getElementById('vitWeight').value);
                const h = parseFloat(document.getElementById('vitHeight').value);
                const bmiVal = (w / ((h / 100) * (h / 100))).toFixed(1);
                
                let bmiCls = "Normal";
                if (bmiVal < 18.5) bmiCls = "Underweight";
                else if (bmiVal >= 25 && bmiVal < 30) bmiCls = "Overweight";
                else if (bmiVal >= 30) bmiCls = "Obese";

                const vPrefix = "VST-";
                const autoVisitNo = vPrefix + String(state.db.visits.length + 1001);

                const newVisit = {
                    visitNo: autoVisitNo,
                    patientId: patientId,
                    dateTime: new Date().toISOString().substring(0, 16),
                    doctor: document.getElementById('vitDoctor').value,
                    weight: w,
                    height: h,
                    bmi: parseFloat(bmiVal),
                    bmiClass: bmiCls,
                    bp: document.getElementById('vitBp').value,
                    temp: parseFloat(document.getElementById('vitTemp').value),
                    symptoms: "",
                    diagnosis: "",
                    treatment: "",
                    notes: "",
                    prescriptions: [],
                    labOrdered: "",
                    labResults: []
                };

                state.db.visits.push(newVisit);

                if (appointmentId) {
                    const apt = state.db.appointments.find(a => a.id === appointmentId);
                    if (apt) apt.status = 'Completed';
                } else {
                    state.db.appointments.push({
                        id: "APT-" + (state.db.appointments.length + 201),
                        patientId: patientId,
                        patientName: patient.name,
                        date: new Date().toISOString().split('T')[0],
                        time: new Date().toTimeString().substring(0, 5),
                        doctor: newVisit.doctor,
                        status: 'Waiting'
                    });
                }

                const bNo = "INV-" + (state.db.billing.length + 5001);
                state.db.billing.push({
                    invoiceNo: bNo,
                    patientId: patientId,
                    patientName: patient.name,
                    date: new Date().toISOString().split('T')[0],
                    services: "General Outpatient Consultation Vitals Review",
                    amount: 25, 
                    status: "Pending"
                });

                logAction(`Vitals saved & patient ${patient.name} queued for ${newVisit.doctor}`);
                saveDatabase();
                closeModal();
                showToast(`Vitals recorded! Patient queued successfully.`, 'success');
                switchTab('dashboard');
            };

            modal.style.display = 'flex';
        }

        function recalculateModalBMI() {
            const w = parseFloat(document.getElementById('vitWeight').value);
            const h = parseFloat(document.getElementById('vitHeight').value);
            if (w && h) {
                const bmiVal = (w / ((h / 100) * (h / 100))).toFixed(1);
                document.getElementById('vitBmi').value = bmiVal;

        function handleInstantSearch(q) {
            state.searchQuery = q.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResultsContainer');
            resultsContainer.innerHTML = '';

            const matches = state.db.patients.filter(p => {
                const matchedDemo = p.id.toLowerCase().includes(state.searchQuery) ||
                                    p.name.toLowerCase().includes(state.searchQuery) ||
                                    p.phone.includes(state.searchQuery);
                
                if (matchedDemo) return true;

                const visits = state.db.visits.filter(v => v.patientId === p.id);
                const matchedClinical = visits.some(v => 
                    v.diagnosis.toLowerCase().includes(state.searchQuery) || 
                    v.symptoms.toLowerCase().includes(state.searchQuery) || 
                    v.labOrdered.toLowerCase().includes(state.searchQuery) ||
                    v.prescriptions.some(rx => rx.drug.toLowerCase().includes(state.searchQuery))
                );

                return matchedClinical;
            });

            if (matches.length === 0) {
                resultsContainer.innerHTML = `
                    <div style="padding:2rem; text-align:center; color:var(--text-secondary);">
                        <p>${t('search_no_results')}</p>
                    </div>
                `;
                return;
            }

            matches.forEach(p => {
                const card = document.createElement('div');
                card.className = "search-result-card";
                card.onclick = () => openPatientMedicalRecord(p.id);
                
                card.innerHTML = `
                    <div>
                        <span class="badge badge-info" style="margin-bottom:0.25rem;">${p.id}</span>
                        <h3 style="font-size:1.1rem;">${maskEncryptedText(p.name, 12)}</h3>
                        <p style="font-size:0.85rem; color:var(--text-secondary); margin-top:0.25rem;">
                            ${t('gender')}: ${t(p.gender)} | ${t('age')}: ${p.age} | ${t('phone')}: ${maskEncryptedText(p.phone, 6)}
                        </p>
                    </div>
                    <div style="display:flex; gap:0.5rem;" class="no-print">
                        <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation(); openPatientCardPrint('${p.id}')">${t('patient_card')}</button>
                        ${state.currentUserRole === 'reception' ? `
                            <button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); initiateVisitFromAppointment('${p.id}')">${t('new_visit')}</button>
                        ` : ''}
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        // CUSTOM SVGS FOR CLINICAL ATTRIBUTES
        function drawWeightTrendSVG(patientId) {
            const container = document.getElementById('weightTrendChart');
            if (!container) return;

            const visits = state.db.visits
                .filter(v => v.patientId === patientId && v.weight > 0)
                .sort((a,b) => new Date(a.dateTime) - new Date(b.dateTime));

            if (visits.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding-top:4rem; font-size:0.85rem; color:var(--text-secondary);">No weight logs captured.</p>`;
                return;
            }

            const padding = 35;
            const w = container.clientWidth || 280;
            const h = 200;

            const minWeight = Math.min(...visits.map(v => v.weight)) - 5;
            const maxWeight = Math.max(...visits.map(v => v.weight)) + 5;
            const weightDiff = (maxWeight - minWeight) || 10;

            let pointsStr = "";
            let dotsSvg = "";

            visits.forEach((v, idx) => {
                const x = padding + (idx / Math.max(visits.length - 1, 1)) * (w - padding * 2);
                const y = h - padding - ((v.weight - minWeight) / weightDiff) * (h - padding * 2);
                pointsStr += `${x},${y} `;
                
                dotsSvg += `
                    <circle cx="${x}" cy="${y}" r="4" fill="var(--accent-color)" />
                    <text x="${x}" y="${y - 8}" font-size="9" font-weight="bold" fill="var(--text-primary)" text-anchor="middle">${v.weight}kg</text>
                    <text x="${x}" y="${h - 10}" font-size="8" fill="var(--text-secondary)" text-anchor="middle">${v.dateTime.split('T')[0].substring(5)}</text>
                `;
            });

            container.innerHTML = `
                <svg width="100%" height="100%" viewBox="0 0 ${w} ${h}">
                    <line x1="${padding}" y1="${padding}" x2="${w-padding}" y2="${padding}" stroke="var(--border-color)" stroke-dasharray="2,2"/>
                    <line x1="${padding}" y1="${(h-padding)/2}" x2="${w-padding}" y2="${(h-padding)/2}" stroke="var(--border-color)" stroke-dasharray="2,2"/>
                    <line x1="${padding}" y1="${h-padding}" x2="${w-padding}" y2="${h-padding}" stroke="var(--border-color)"/>
                    ${visits.length > 1 ? `<polyline fill="none" stroke="var(--accent-color)" stroke-width="2" points="${pointsStr.trim()}"/>` : ''}
                    ${dotsSvg}
                </svg>
            `;
        }

        function drawBPTrendSVG(patientId) {
            const container = document.getElementById('bpTrendChart');
            if (!container) return;

            const visits = state.db.visits
                .filter(v => v.patientId === patientId && v.bp)
                .sort((a,b) => new Date(a.dateTime) - new Date(b.dateTime));

            if (visits.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding-top:4rem; font-size:0.85rem; color:var(--text-secondary);">No BP logs captured.</p>`;
                return;
            }

            const parsedVisits = visits.map(v => {
                const parts = v.bp.split('/');
                return {
                    sys: parseInt(parts[0]) || 120,
                    dia: parseInt(parts[1]) || 80,
                    date: v.dateTime.split('T')[0].substring(5)
                };
            });

            const padding = 35;
            const w = container.clientWidth || 280;
            const h = 200;

            const minVal = 50;
            const maxVal = 180;
            const diffVal = maxVal - minVal;

            let sysPoints = "";
            let diaPoints = "";
            let plotSvg = "";

            parsedVisits.forEach((v, idx) => {
                const x = padding + (idx / Math.max(parsedVisits.length - 1, 1)) * (w - padding * 2);
                const sysY = h - padding - ((v.sys - minVal) / diffVal) * (h - padding * 2);
                const diaY = h - padding - ((v.dia - minVal) / diffVal) * (h - padding * 2);

                sysPoints += `${x},${sysY} `;
                diaPoints += `${x},${diaY} `;

                plotSvg += `
                    <circle cx="${x}" cy="${sysY}" r="3.5" fill="var(--danger-color)" />
                    <text x="${x}" y="${sysY - 6}" font-size="8" font-weight="bold" fill="var(--danger-color)" text-anchor="middle">${v.sys}</text>
                    <circle cx="${x}" cy="${diaY}" r="3.5" fill="#2563eb" />
                    <text x="${x}" y="${diaY + 11}" font-size="8" font-weight="bold" fill="#2563eb" text-anchor="middle">${v.dia}</text>
                    <text x="${x}" y="${h - 10}" font-size="8" fill="var(--text-secondary)" text-anchor="middle">${v.date}</text>
                `;
            });

            container.innerHTML = `
                <svg width="100%" height="100%" viewBox="0 0 ${w} ${h}">
                    <line x1="${padding}" y1="${padding}" x2="${w-padding}" y2="${padding}" stroke="var(--border-color)" stroke-dasharray="2,2"/>
                    <line x1="${padding}" y1="${(h-padding)/2}" x2="${w-padding}" y2="${(h-padding)/2}" stroke="var(--border-color)" stroke-dasharray="2,2"/>
                    <line x1="${padding}" y1="${h-padding}" x2="${w-padding}" y2="${h-padding}" stroke="var(--border-color)"/>
                    ${parsedVisits.length > 1 ? `<polyline fill="none" stroke="var(--danger-color)" stroke-width="2" points="${sysPoints.trim()}"/>` : ''}
                    ${parsedVisits.length > 1 ? `<polyline fill="none" stroke="#2563eb" stroke-width="2" points="${diaPoints.trim()}"/>` : ''}
                    ${plotSvg}
                </svg>
            `;
        }

        function handleDoctorClinicalSave(e, visitNo) {
            e.preventDefault();
            const visit = state.db.visits.find(v => v.visitNo === visitNo);
            if (!visit) return;

            visit.symptoms = document.getElementById('docSymptoms').value;
            visit.diagnosis = document.getElementById('docDiagnosis').value;
            visit.treatment = document.getElementById('docTreatment').value;
            visit.notes = document.getElementById('docNotes').value;

            const prescriptionList = [];
            const dNames = document.getElementsByName('rxDrugName');
            const dDosages = document.getElementsByName('rxDosage');
            const dFrequencies = document.getElementsByName('rxFrequency');
            const dDurations = document.getElementsByName('rxDuration');

            for (let i = 0; i < dNames.length; i++) {
                if (dNames[i].value.trim() !== "") {
                    prescriptionList.push({
                        drug: dNames[i].value.trim(),
                        dosage: dDosages[i].value.trim(),
                        frequency: dFrequencies[i].value.trim(),
                        duration: dDurations[i].value.trim()
                    });

                    const invItem = state.db.inventory.find(inv => inv.drug.toLowerCase().includes(dNames[i].value.trim().toLowerCase()));
                    if (invItem) {
                        const days = parseInt(dDurations[i].value) || 5;
                        const qtyToDeduct = days * 2; 
                        invItem.stock = Math.max(0, invItem.stock - qtyToDeduct);
                    }
                }
            }
            visit.prescriptions = prescriptionList;

            const checkedLabs = [];
            const checkboxes = document.getElementsByName('labCheckboxes');
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    checkedLabs.push(cb.value);
                }
            });

            if (checkedLabs.length > 0) {
                visit.labOrdered = checkedLabs.join(', ');
                visit.labResults = checkedLabs.map(testName => {
                    let refRange = "Negative";
                    if (testName.includes("Count")) refRange = "4.0 - 11.0 x10^9/L";
                    else if (testName.includes("Sugar")) refRange = "70 - 100 mg/dL";
                    else if (testName.includes("Profile")) refRange = "Total Cholesterol < 200 mg/dL";
                    else if (testName.includes("Urinalysis")) refRange = "Clear/Yellow, Nil Sugar";
                    
                    return {
                        testName: testName,
                        value: "",
                        range: refRange,
                        technician: "",
                        status: "pending",
                        date: ""
                    };
                });
            }

            const apt = state.db.appointments.find(a => a.patientId === visit.patientId && a.status === 'Waiting');
            if (apt) apt.status = 'Completed';

            const bill = state.db.billing.find(b => b.patientId === visit.patientId && b.status === "Pending");
            if (bill) {
                let extraFee = 0;
                if (prescriptionList.length > 0) extraFee += (prescriptionList.length * 10);
                if (checkedLabs.length > 0) extraFee += (checkedLabs.length * 15);
                bill.amount += extraFee;
                bill.services += `, Pharmacy Rx (${prescriptionList.length} items)` + (checkedLabs.length > 0 ? `, Laboratory (${checkedLabs.length} tests)` : '');
            }

            logAction(`Consultation finalised for visit ${visitNo}. Diagnosis: ${visit.diagnosis}`);
            saveDatabase();
            showToast("Clinical report & treatment sheet successfully saved!", "success");
            
            openPatientMedicalRecord(visit.patientId);
        }

        function simulateAlertNotification(aptId, method) {
            const apt = state.db.appointments.find(a => a.id === aptId);
            if (!apt) return;

            const p = state.db.patients.find(x => x.id === apt.patientId);
            const phone = p ? p.phone : "+252 61 XXX XXX";

            const modal = document.getElementById('generalModal');
            document.getElementById('modalTitle').innerText = `${method.toUpperCase()} Outgoing API Integration Delivery Payload`;

        function exportDatabaseBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.db, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "AlShifa_Clinic_Database_Backup_" + new Date().toISOString().split('T')[0] + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast(t('backup_success'), "success");
            logAction("Generated a physical database export file");
        }

        function simulateCloudSyncTrigger() {
            showToast("Verifying Cloud SSH Handshake...", "info");
            setTimeout(() => {
                showToast("Clinic Database successfully pushed and synced to cloud server!", "success");
                state.syncPendingCount = 0;
                updateSyncBadge();
            }, 1200);
        }

        function exportToExcel() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Patient ID,Full Name,Gender,DOB,Age,Phone,Address,Emergency Contact\n";
            
            state.db.patients.forEach(p => {
                const row = `"${p.id}","${p.name}","${p.gender}","${p.dob}",${p.age},"${p.phone}","${p.address}","${p.emergency}"`;
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "AlShifa_Patients_Directory_Export.csv");
            document.body.appendChild(link);
            link.click();
            link.remove();
            showToast("Patient Directory database successfully exported to Excel (CSV)!", "success");
        }

                    <div style="border-bottom:1px dashed #000; padding-bottom:0.5rem; margin-bottom:0.5rem; font-size:0.8rem;">
                        <div class="hospital-card-row"><span><b>Patient Name:</b></span><span>${p.name}</span></div>
                        <div class="hospital-card-row"><span><b>Patient ID:</b></span><span>${p.id}</span></div>
                        <div class="hospital-card-row"><span><b>Requesting Doctor:</b></span><span>${v.doctor}</span></div>
                        <div class="hospital-card-row"><span><b>Report Date:</b></span><span>${v.labResults[0] ? v.labResults[0].date : ''}</span></div>
                    </div>
                    <table style="width:100%; font-size:0.8rem; border-collapse:collapse; margin:1rem 0;">
                        <thead>
                            <tr style="border-bottom:1px solid #000; text-align:left;">
                                <th>Test Parameter</th>
                                <th>Result Value</th>
                                <th>Normal Reference Range</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${v.labResults.map(res => `
                                <tr style="border-bottom:1px dashed #ccc; height:30px;">
                                    <td><b>${res.testName}</b></td>
                                    <td><b>${res.value}</b></td>
                                    <td>${res.range}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div style="border-top:1px dashed #000; padding-top:1rem; margin-top:2rem; display:flex; justify-content:space-between; font-size:0.75rem;">
                        <div>
                            <span>Authorized Code:</span>
                            <p><b>LAB-REF-${v.visitNo}</b></p>
                        </div>
                        <div style="text-align:center; border-top:1px solid #000; width:150px; padding-top:0.25rem; margin-top:1rem;">
                            Pathologist Sign-off
                        </div>
                    </div>
                </div>
            `;

            const actBtn = document.getElementById('modalActionButton');
            actBtn.innerText = t('print');
            actBtn.onclick = () => {
                window.print();
            };

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('generalModal').style.display = 'none';
        }
    </script>
</body>
</html>
